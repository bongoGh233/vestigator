# Render Blueprint — deploy Vestigator as a single always-on web service
# (API + WebSocket + built React client on one port).
#
#  1. Push this repo to GitHub (or GitLab).
#  2. On Render: New > Blueprint  ->  connect your repo. Everything below
#     is applied automatically and you get a free https://vestigator.onrender.com.
#
# The database is PostgreSQL hosted on Supabase. Persistence lives in Supabase,
# not on the Render filesystem. Set DATABASE_URL and DIRECT_URL in the Render
# dashboard (Environment tab) using the Supabase connection strings — they are
# required for the build (prisma generate) and for the running server.
services:
  - type: web
    name: vestigator
    runtime: node
    repo: https://github.com/bongoGh233/vestigator
    plan: free
    healthCheckPath: /health
    # NODE_ENV=production is set below and applies during the build too, so
    # plain `npm ci` would skip devDependencies (vite) and the client build
    # would fail with "vite: not found". --include=dev keeps them for the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://vestigator.onrender.com
      - key: ARRIVE_THRESHOLD_M
        value: "80"
      - key: TRACK_CODE_TTL_MIN
        value: "10"
      - key: OSRM_SERVER
        value: https://router.project-osrm.org
      # Set these in the Render dashboard after deploy (Environment tab):
      # DATABASE_URL  — Supabase pooled connection string (server runtime)
      # DIRECT_URL    — Supabase direct connection string (Prisma migrations)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Set these in the Render dashboard after deploy (Environment tab):
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
