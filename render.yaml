# Render Blueprint — deploy Vestigator as a single always-on web service
# (API + WebSocket + built React client on one port).
#
#  1. Push this repo to GitHub (or GitLab).
#  2. On Render: New > Blueprint  ->  connect your repo. Everything below
#     is applied automatically and you get a free https://vestigator.onrender.com.
#
# The free tier uses an ephemeral filesystem, so the SQLite DB is lost on
# restart/redeploy (DATA_DIR points at a writable /tmp dir below). To keep
# data across deploys, switch plan to starter, uncomment the disk block, and
# set DATA_DIR back to /var/data.
services:
  - type: web
    name: vestigator
    runtime: node
    repo: https://github.com/bongoGh233/vestigator
    plan: free
    healthCheckPath: /health
    # NODE_ENV=production is set below and applies during the build too, so
    # plain `npm ci` would skip devDependencies (vite) and the client build
    # would fail with "vite: not found". --include=dev keeps them for the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://vestigator.onrender.com
      # /var/data is not writable without a mounted disk (free tier), which
      # crashed the app with "EACCES: permission denied, mkdir '/var/data'".
      # /tmp is always writable. Change back to /var/data if you enable the
      # disk block below.
      - key: DATA_DIR
        value: /tmp/vestigator-data
      - key: ARRIVE_THRESHOLD_M
        value: "80"
      - key: TRACK_CODE_TTL_MIN
        value: "10"
      - key: OSRM_SERVER
        value: https://router.project-osrm.org
      # Set these in the Render dashboard after deploy (Environment tab):
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
    # Persistent disk — requires a paid (starter+) instance. When enabled,
    # also set DATA_DIR (above) back to /var/data:
    # disk:
    #   name: vestigator-data
    #   mountPath: /var/data
    #   sizeGB: 1
